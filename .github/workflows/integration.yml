name: Integration Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  integration-qemu:
    runs-on: ubuntu-latest
    container: ghcr.io/matthewchavis8/hyperberry-toolchain:llvm-22.1.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up CI toolchain
        uses: ./.github/actions/setup-ci
      - name: Configure QEMU integration tests
        run: cmake --preset debug
      - name: Build QEMU integration tests
        run: cmake --build --preset debug --target hyperberry-qemu-test
      - name: Build QEMU guest archive
        run: cmake --build --preset debug --target guest-archive-qemu
      - name: Run QEMU integration tests
        uses: ./.github/actions/run-qemu-integration
        with:
          kernel: build/debug/qemu/integration/kernel8.img
          initrd: build/debug/qemu/integration/guest.cpio
          log: build/debug/qemu/integration/qemu.log
      - name: Upload QEMU serial logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: build/debug/qemu/integration/*.log
