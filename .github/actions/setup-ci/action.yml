name: Setup CI Toolchain
description: Install the cross toolchain and utilities needed by HyperBerry CI jobs.

runs:
  using: composite
  steps:
    - name: Validate toolchain image
      shell: bash
      run: |
        clang-22 --version
        test -f "$HB_LLVM_SYSROOT/include/c++/v1/array"
        test -f "$HB_LLVM_SYSROOT/lib/libc++.a"
        test -f "$HB_LLVM_SYSROOT/lib/libc.a"
